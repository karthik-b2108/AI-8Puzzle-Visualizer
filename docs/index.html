<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive visualizer for depth-first search on the 8-puzzle."
    />
    <meta name="theme-color" content="#f6f7fb" />
    <title>DFS 8-Puzzle Visualizer</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var stored = JSON.parse(localStorage.getItem('dfs-settings') || 'null')
        var theme = stored && stored.state && stored.state.theme
        if (!theme || theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script type="module" crossorigin src="/assets/index-IwawWdam.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BpapBYNa.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
